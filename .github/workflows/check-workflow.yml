---
name: check workflow
on:
  pull_request:
    paths:
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
permissions:
  contents: read
jobs:
  check-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # reviewdog posts the findings as review comments.
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          reporter: github-pr-review
          fail_level: any
