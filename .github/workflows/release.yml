name: release

# See docs/release.md for the procedure.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Only one release runs at a time. GitHub keeps one pending run per group,
# so a newer pending run replaces an older pending one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The VSIX is built only once. The same file is tried by hand and published to both stores.
  build:
    uses: ./.github/workflows/main.yml
    with:
      release: true

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
      sha256: ${{ steps.draft.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the version in package.json is $version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi
      - name: Download the VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsce file
          path: build
      - name: Create a draft release with the VSIX
        id: draft
        run: |
          vsix="build/cloudlatex-${GITHUB_REF_NAME#v}.vsix"
          test -f "$vsix"
          if gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" --silent 2>/dev/null; then
            echo "::error::$GITHUB_REF_NAME is already released."
            exit 1
          fi
          drafts() {
            gh api "repos/$GH_REPO/releases" --paginate \
              --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id"
          }
          # Remove drafts left by a rejected run. They are deleted by id, never by tag name.
          for id in $(drafts); do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
          gh release create "$GITHUB_REF_NAME" "$vsix" \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          ids=$(drafts)
          if [ "$(echo "$ids" | wc -w)" != 1 ]; then
            echo "::error::Expected one draft release for $GITHUB_REF_NAME, found: $ids"
            exit 1
          fi
          sha256=$(sha256sum "$vsix" | cut -d ' ' -f 1)
          echo "release-id=$ids" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "SHA-256 of the VSIX: $sha256" >> "$GITHUB_STEP_SUMMARY"

  # This job can publish to the stores. It installs only the publishing tools from
  # .github/publish, never the dependencies of the extension, and runs no install scripts.
  publish:
    needs: draft
    runs-on: ubuntu-latest
    # Waits for approval. The required reviewers are set in the repository settings.
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.x'
      - name: Install the publishing tools
        run: npm ci --ignore-scripts --prefix .github/publish
      - name: Download the VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsce file
          path: build
      - name: Check that the VSIX is the one attached to the draft release
        env:
          SHA256: ${{ needs.draft.outputs.sha256 }}
        run: echo "$SHA256  build/cloudlatex-${GITHUB_REF_NAME#v}.vsix" | sha256sum --check
      - name: Publish to Visual Studio Marketplace
        run: .github/publish/node_modules/.bin/vsce publish --oidc --skip-duplicate --packagePath "build/cloudlatex-${GITHUB_REF_NAME#v}.vsix"
      - name: Publish to Open VSX
        run: .github/publish/node_modules/.bin/ovsx publish --trusted-publishing --skip-duplicate --packagePath "build/cloudlatex-${GITHUB_REF_NAME#v}.vsix"

  # Runs after both stores accepted the VSIX. It has no access to the stores.
  finalize:
    needs: [draft, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
          SHA256: ${{ needs.draft.outputs.sha256 }}
        run: |
          release=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          check() {
            if [ "$(echo "$release" | jq -r "$1")" != "$2" ]; then
              echo "::error::Unexpected draft release: $1 is not $2."
              exit 1
            fi
          }
          check '.draft' 'true'
          check '.tag_name' "$GITHUB_REF_NAME"
          check '.assets | length' '1'
          check '.assets[0].digest' "sha256:$SHA256"
          gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
