name: build

# Lints and packages the extension on pushes to main, pull requests and manual runs.
# release.yml also calls it to build the VSIX of a release.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Build without the dependency cache.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Setup NodeJs
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: '24.x'
        # A release is built without a cache restored from earlier runs.
        cache: ${{ !inputs.release && 'yarn' || '' }}
    - name: Install Dependencies
      run: yarn install --frozen-lockfile
    - name: lint
      run: yarn run lint
    - name: build vsce
      run: yarn run vsce
    - name: Archive vsce result
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: vsce file
        path: build
